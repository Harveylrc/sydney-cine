# Every Sydney cinema: slug (as the scrapers write it), display name, local
# government area, region (the eight in DECISIONS.md 2026-10-18 "Regions"; a list
# when a cinema belongs to more than one) and screen count, for the coverage
# figure (coverage.py). Cinemas we don't scrape are listed too, with
# `scraped: false`, so the figure has the whole of Sydney as its total.
# A scraped cinema missing here shows under no region and is logged by export.py.
# `closed: true` (e.g. for a refurbishment) leaves a cinema out of the coverage
# figure altogether; a closed cinema that has sessions again counts as open.
#
# Screen counts (B7, checked 2026-10-19): from each cinema's own site where it
# states one; Hoyts gives none, so its counts are the screens in its own session
# data (EQ: 11 seen, 12 known). Not from the cinema's own site: Palace Central and
# Norton Street (Time Out), Drive-In (EVT, its parent company), Reading, United,
# Mount Vic Flicks, Govinda's (Cinema Treasures / Flicks / Destination NSW).
# Richmond Regent: 1, from its venue page (a single 600-seat auditorium with a
# digital cinema screen; B13d).
# Uncertain: Event Macquarie (its page says 13 but lists 16), Hoyts Chatswood
# Westfield (6, maybe 7), Reading Auburn (8 or 9). Unknown, left out of the
# figure: Dumaresq Street. United Opera Quays is closed for refurbishment (closed: true).

# Regions (DECISIONS 2026-10-18), in the page's order: each region's local
# government areas, all of them, cinema or not. The page's Region ⓘ popover and
# public/regions-map.svg are built from this table (B20).
regions:
  City: [City of Sydney]
  East: [Waverley, Woollahra, Randwick, Bayside]
  Inner West: [Inner West, Burwood, Strathfield, Canada Bay]
  North: [North Sydney, Mosman, Willoughby, Lane Cove, Hunters Hill, Ryde, Ku-ring-gai, Hornsby, Northern Beaches]
  Parramatta & Hills: [Parramatta, Cumberland, The Hills, Hawkesbury]
  Outer West: [Blacktown, Penrith, Blue Mountains]
  South West: [Fairfield, Liverpool, Canterbury-Bankstown, Camden, Campbelltown, Wollondilly]
  St George & Sutherland: [Georges River, Sutherland]

