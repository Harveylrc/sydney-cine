<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sydney Cinema Guide</title>
<meta name="description" content="Every showing at Sydney cinemas on one page, filterable by film, director, type and date.">
<style>
  :root {
    --bg: #181D3B;        /* page background */
    --inset: #131934;     /* inset fields */
    --divider: #0E1227;   /* rules between entries */
    --heading: #F2EAF1;   /* headings and key figures */
    --label: #CAD0E5;     /* labels and body text */
    --border: #4D5884;    /* field and button borders */
    --accent: #E8B86D;    /* links and the active filter */
    --muted: #9AA3C7;     /* secondary figures (session counts) */

    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --gutter: 32px;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
  }

  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px var(--gutter) 48px;
  }

  /* Masthead */
  header { border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  h1 {
    margin: 0;
    color: var(--heading);
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .standfirst { margin: 4px 0 0; }

  /* Views and filters */
  .views {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 18px 0 12px;
  }
  .views button, .filters button {
    font: inherit;
    font-size: 0.9rem;
    color: var(--label);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
  }
  .views button[aria-pressed="true"] {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  .filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 12px;
    padding: 14px 0 18px;
    border-bottom: 1px solid var(--border);
  }
  .filters label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .filters input, .filters select {
    font: inherit;
    font-size: 0.95rem;
    text-transform: none;
    letter-spacing: normal;
    color: var(--heading);
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    width: 100%;
    min-width: 0;
  }
  .filters .active { border-color: var(--accent); }
  .years { display: flex; gap: 6px; align-items: center; }
  .filters .reset { align-self: end; justify-self: start; }

  .summary { margin: 14px 0 0; font-size: 0.9rem; }

  /* Listings */
  .day { margin-top: 28px; }
  .day h2 {
    margin: 0;
    padding-bottom: 6px;
    color: var(--heading);
    font-size: 1.35rem;
    font-weight: 800;
    border-bottom: 1px solid var(--border);
  }
  .film { border-bottom: 1px solid var(--divider); }
  /* One line per film: title · year · director, count on the right; tap opens the panel. */
  .film button {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    padding: 4px 0;
    font: inherit;
    line-height: 1.25;
    color: inherit;
    background: none;
    border: 0;
    text-align: left;
    cursor: pointer;
  }
  .film .line {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 0.9rem;
  }
  .film .title { color: var(--heading); font-size: 1.05rem; font-weight: 700; }
  .film button:hover .title { text-decoration: underline; }
  .count {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .count::after { content: " ›"; }
  @media (max-width: 480px) {
    .count .where { display: none; } /* room for the title; the panel names the cinemas */
  }

  /* Film panel: right-hand side panel on wide screens, full-screen sheet below 900px. */
  body:has(.panel[open]) { overflow: hidden; }
  .panel {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    color: var(--label);
    background: var(--bg);
    border: 0;
  }
  .panel::backdrop { background: rgba(5, 7, 18, 0.6); }
  @media (min-width: 900px) {
    .panel {
      left: auto;
      width: min(480px, 42vw);
      border-left: 1px solid var(--border);
    }
  }
  .panel-body { padding: 18px var(--gutter) 40px; }
  .panel .close {
    float: right;
    margin: -4px -6px 0 12px;
    font: inherit;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--label);
    background: none;
    border: 0;
    padding: 4px 8px;
    cursor: pointer;
  }
  .panel-top { display: flex; gap: 16px; align-items: flex-start; }
  .panel-top img {
    flex: none;
    width: 120px;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 4px;
    background: var(--inset);
  }
  .panel h2 {
    margin: 0;
    color: var(--heading);
    font-size: 1.4rem;
    font-weight: 800;
    line-height: 1.2;
  }
  .panel .facts { margin: 6px 0 0; font-size: 0.9rem; }
  .panel .facts p { margin: 0; }
  .panel .rating { color: var(--heading); font-weight: 600; }
  .panel .synopsis { margin: 16px 0 0; }
  .panel h3 {
    margin: 22px 0 6px;
    padding-bottom: 4px;
    color: var(--heading);
    font-size: 1rem;
    border-bottom: 1px solid var(--border);
  }
  /* One row per session: time · cinema · tags */
  .sessions {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.9rem;
  }
  .sessions li + li { margin-top: 2px; }
  .sessions .time {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
  }
  .sessions a.time:hover { text-decoration: underline; }
  .sessions .late, .sessions .tags { font-size: 0.75rem; }

  @media (max-width: 480px) {
    :root { --gutter: 16px; }
  }

  .empty { margin-top: 28px; }

  footer {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
  }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Sydney Cinema Guide</h1>
    <p class="standfirst">What's on at Sydney cinemas.</p>
  </header>

  <nav class="views" aria-label="Views">
    <button type="button" data-view="all" aria-pressed="true">All showings</button>
    <button type="button" data-view="new" aria-pressed="false">New this week</button>
    <button type="button" data-view="retro" aria-pressed="false">Retrospectives</button>
  </nav>

  <form class="filters" id="filters" autocomplete="off">
    <label>Film
      <input type="search" name="film" placeholder="Any film">
    </label>
    <label>Director
      <input type="search" name="director" list="directors" placeholder="Any director">
      <datalist id="directors"></datalist>
    </label>
    <label>Type
      <select name="type">
        <option value="">Any type</option>
        <option value="new_release">New release</option>
        <option value="retrospective">Retrospective</option>
        <option value="festival">Festival</option>
        <option value="special">Special</option>
      </select>
    </label>
    <label>Date
      <select name="day"><option value="">Any date</option></select>
    </label>
    <label>Released
      <span class="years">
        <input type="number" name="from" inputmode="numeric" placeholder="From" min="1890" max="2100">
        <input type="number" name="to" inputmode="numeric" placeholder="To" min="1890" max="2100">
      </span>
    </label>
    <label>Sort
      <select name="sort" data-default="popular">
        <option value="popular">Popular</option>
        <option value="az">A–Z</option>
      </select>
    </label>
    <button type="reset" class="reset">Clear filters</button>
  </form>

  <p class="summary" id="summary" aria-live="polite">Loading showings…</p>
  <main id="listings"></main>

  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <div class="panel-body" id="panel-body"></div>
  </dialog>

  <footer>
    <p id="updated"></p>
    <p>Film details from <a href="https://www.themoviedb.org/">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p>Times link to each cinema's own booking page. Check there before you go.</p>
  </footer>
</div>

<script>
(() => {
  const $ = (sel) => document.querySelector(sel);
  const form = $("#filters");
  const listings = $("#listings");
  const summary = $("#summary");
  let data = null;
  let filmsById = new Map();
  let thisYear = new Date().getFullYear();
  let unfiltered = new Map(); // day -> film id -> all that day's showings, for ranking
  let byFilm = new Map(); // film id -> all its showings in start order, for the panel
  let view = "all";

  // Element helper: text is always set as text, never parsed as HTML.
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) if (child) node.append(child);
    return node;
  }

  const fold = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const dayHeading = (iso) =>
    new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", {
      weekday: "long", day: "numeric", month: "long", timeZone: "UTC",
    });

  const dayShort = (iso) =>
    new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", {
      weekday: "short", day: "numeric", month: "short", timeZone: "UTC",
    });

  const safeUrl = (url) => (url && /^https?:\/\//.test(url) ? url : null);

  function currentFilters() {
    const f = new FormData(form);
    const year = (v) => (v ? Number(v) : null);
    return {
      film: fold(f.get("film").trim()),
      director: fold(f.get("director").trim()),
      type: f.get("type"),
      day: f.get("day"),
      from: year(f.get("from")),
      to: year(f.get("to")),
      sort: f.get("sort"),
    };
  }

  // rank:start — Popular score (DECISIONS 2026-10-18 "Ranking formula"); tests/test_rank.py runs this block in node.
  // Quality × familiarity, plus an age bonus, a capped share for session count and a
  // small bump for independent cinemas. A recent film shown as a retrospective (a
  // re-release) gets no age bonus and its votes are capped lower.
  const CHAINS = ["hoyts-", "event-", "reading-"];
  function rankScore(film, showings, thisYear) {
    const rerelease = film.year != null && thisYear - film.year < 10 && showings.some((s) => s.type === "retrospective");
    const age = film.year != null && !rerelease ? Math.max(thisYear - film.year, 0) : 0;
    const votes = Math.min(film.vote_count || 0, rerelease ? 5000 : 30000);
    const quality = Math.max((film.rating || 0) - 5, 0);
    const independent = showings.filter((s) => !CHAINS.some((c) => s.venue.startsWith(c))).length;
    return quality * Math.log(votes + 1) + 1.5 * Math.log(age + 1)
      + 0.15 * Math.min(showings.length, 80) + 0.3 * Math.min(independent, 5);
  }
  // rank:end
  const byTitle = (a, b) => a.film.title.localeCompare(b.film.title, "en", { sensitivity: "base" });
  const ORDERS = {
    popular: (a, b) => b.score - a.score || byTitle(a, b),
    az: byTitle,
  };

  // Ranks on all of a film's sessions that day, whatever the filters (Harvey, B9b).
  function orderFilms(day, films, sort) {
    return [...films]
      .map(([id, showings]) => {
        const film = filmsById.get(id);
        return { film, showings, score: rankScore(film, unfiltered.get(day).get(id), thisYear) };
      })
      .sort(ORDERS[sort] || ORDERS.popular);
  }

  function matches(s, film, f) {
    if (view === "new" && !(film.new_this_week && s.type === "new_release")) return false;
    if (view === "retro" && s.type !== "retrospective") return false;
    if (f.film && !fold(film.title).includes(f.film) && !fold(s.title).includes(f.film)) return false;
    if (f.director && !fold(film.director).includes(f.director)) return false;
    if (f.type && s.type !== f.type) return false;
    if (f.day && s.day !== f.day) return false;
    if ((f.from || f.to) && film.year == null) return false;
    if (f.from && film.year < f.from) return false;
    if (f.to && film.year > f.to) return false;
    return true;
  }

  function markActive() {
    for (const field of form.querySelectorAll("input, select")) {
      field.classList.toggle("active", field.value !== (field.dataset.default || ""));
    }
  }

  // One line: title · year · director, then the count. Tapping opens the film panel.
  function filmEntry(film, showings) {
    const line = el("span", { class: "line" }, el("span", { class: "title", text: film.title }));
    for (const part of [film.year, film.director]) if (part) line.append(" · " + part);
    const button = el("button", { type: "button", "aria-haspopup": "dialog" },
      line, countLabel(showings));
    button.addEventListener("click", () => openFilm(film.id));
    return el("article", { class: "film" }, button);
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const venueName = (slug) => (data.venues[slug] && data.venues[slug].name) || slug;

  // "14 sessions · 9 cinemas"; one cinema is named: "1 session · Ritz Randwick".
  // Phones show the sessions part only.
  function countLabel(showings) {
    const venues = new Set(showings.map((s) => s.venue));
    const where = venues.size === 1 ? venueName([...venues][0]) : plural(venues.size, "cinema");
    return el("span", { class: "count" }, plural(showings.length, "session"),
      el("span", { class: "where", text: ` · ${where}` }));
  }

  function sessionRows(film, showings) {
    const rows = el("ul", { class: "sessions" });
    for (const s of showings) {
      const url = safeUrl(s.booking_url);
      const time = url
        ? el("a", { class: "time", href: url, rel: "noopener", target: "_blank", text: s.time })
        : el("span", { class: "time", text: s.time });
      const row = el("li", {}, time);
      if (s.late) row.append(" ", el("span", { class: "late", text: "(late)" }));
      row.append(" · " + venueName(s.venue));
      if (s.attributes.length) row.append(" · ", el("span", { class: "tags", text: s.attributes.join(", ") }));
      if (s.title !== film.title) row.title = s.title;
      rows.append(row);
    }
    return rows;
  }

  // Film panel. Opening adds #film=<id> to the address (so a film can be linked and
  // Back closes it); Esc, the close button and a tap outside all go back.
  const panel = $("#panel");
  const POSTER = "https://image.tmdb.org/t/p/w342";
  let opener = null;

  function panelContent(film) {
    const body = $("#panel-body");
    const facts = el("div", { class: "facts" });
    const line = [film.year, film.director, film.runtime && `${film.runtime} min`].filter(Boolean);
    if (line.length) facts.append(el("p", { text: line.join(" · ") }));
    if (film.rating != null) {
      facts.append(el("p", {}, el("span", { class: "rating", text: film.rating.toFixed(1) }),
        ` TMDB (${plural(film.vote_count || 0, "vote")})`));
    }
    const top = el("div", { class: "panel-top" });
    if (film.poster_path) top.append(el("img", { src: POSTER + film.poster_path, alt: "", width: "120", height: "180" }));
    top.append(el("div", {}, el("h2", { id: "panel-title", text: film.title }), facts));
    const close = el("button", { type: "button", class: "close", "aria-label": "Close", text: "×" });
    close.addEventListener("click", closePanel);
    body.replaceChildren(close, top);
    if (film.overview) body.append(el("p", { class: "synopsis", text: film.overview }));

    const byDay = new Map();
    for (const s of byFilm.get(film.id) || []) {
      if (!byDay.has(s.day)) byDay.set(s.day, []);
      byDay.get(s.day).push(s);
    }
    for (const [day, showings] of byDay) {
      body.append(el("h3", { text: `${dayHeading(day)} · ${plural(showings.length, "session")}` }),
        sessionRows(film, showings));
    }
  }

  const hashFilm = () => {
    const m = location.hash.match(/^#film=(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  };

  function showPanel() {
    const film = filmsById.get(hashFilm());
    if (!film) {
      if (panel.open) panel.close();
      return;
    }
    panelContent(film);
    if (!panel.open) panel.showModal();
    panel.scrollTop = 0;
  }

  function openFilm(id) {
    opener = document.activeElement;
    history.pushState({ panel: true }, "", "#film=" + encodeURIComponent(id));
    showPanel();
  }

  function closePanel() {
    if (history.state && history.state.panel) {
      history.back(); // popstate hides the panel
    } else { // opened from a link: drop the hash without leaving the page
      history.replaceState(null, "", location.pathname + location.search);
      showPanel();
    }
  }

  panel.addEventListener("cancel", (e) => { e.preventDefault(); closePanel(); });
  panel.addEventListener("click", (e) => { if (e.target === panel) closePanel(); }); // the backdrop
  panel.addEventListener("close", () => {
    if (opener && document.contains(opener)) opener.focus();
    opener = null;
  });
  window.addEventListener("popstate", () => data && showPanel());
  window.addEventListener("hashchange", () => data && showPanel());

  function render() {
    markActive();
    const f = currentFilters();
    const days = new Map(); // day -> film id -> showings, in start order
    let count = 0;
    for (const s of data.showings) {
      const film = filmsById.get(s.film);
      if (!film || !matches(s, film, f)) continue;
      count++;
      if (!days.has(s.day)) days.set(s.day, new Map());
      const films = days.get(s.day);
      if (!films.has(s.film)) films.set(s.film, []);
      films.get(s.film).push(s);
    }

    listings.replaceChildren();
    for (const [day, films] of [...days].sort(([a], [b]) => a.localeCompare(b))) {
      const section = el("section", { class: "day" }, el("h2", { text: dayHeading(day) }));
      for (const { film, showings } of orderFilms(day, films, f.sort)) section.append(filmEntry(film, showings));
      listings.append(section);
    }

    const filmCount = new Set([...days.values()].flatMap((films) => [...films.keys()])).size;
    summary.textContent = count
      ? `${count} showing${count === 1 ? "" : "s"} of ${filmCount} film${filmCount === 1 ? "" : "s"}`
      : "";
    if (!count) {
      const msg = view === "new"
        ? "No new releases have appeared this week yet."
        : "No showings match these filters.";
      listings.append(el("p", { class: "empty", text: msg }));
    }
  }

  function populateFilters() {
    const daySelect = form.elements.day;
    for (const day of [...new Set(data.showings.map((s) => s.day))].sort()) {
      daySelect.append(el("option", { value: day, text: dayShort(day) }));
    }
    const directors = new Set();
    for (const film of data.films) {
      for (const name of (film.director || "").split(", ")) if (name) directors.add(name);
    }
    $("#directors").append(...[...directors].sort().map((name) => el("option", { value: name })));
  }

  document.querySelectorAll(".views button").forEach((button) => {
    button.addEventListener("click", () => {
      view = button.dataset.view;
      document.querySelectorAll(".views button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === button)));
      render();
    });
  });
  form.addEventListener("input", () => data && render());
  form.addEventListener("reset", () => setTimeout(() => data && render()));
  form.addEventListener("submit", (e) => e.preventDefault());

  fetch("data.json", { cache: "no-cache" })
    .then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then((json) => {
      data = json;
      filmsById = new Map(data.films.map((f) => [f.id, f]));
      thisYear = Number(data.generated_at.slice(0, 4)) || thisYear;
      for (const s of data.showings) {
        if (!unfiltered.has(s.day)) unfiltered.set(s.day, new Map());
        const films = unfiltered.get(s.day);
        if (!films.has(s.film)) films.set(s.film, []);
        films.get(s.film).push(s);
        if (!byFilm.has(s.film)) byFilm.set(s.film, []);
        byFilm.get(s.film).push(s);
      }
      for (const showings of byFilm.values()) showings.sort((a, b) => a.start.localeCompare(b.start));
      const updated = new Date(data.generated_at).toLocaleString("en-AU", {
        timeZone: "Australia/Sydney", weekday: "short", day: "numeric", month: "short",
        hour: "numeric", minute: "2-digit",
      });
      $("#updated").textContent = `Updated ${updated}. Cinemas: ${
        Object.values(data.venues).map((v) => v.name).join(", ")}.`;
      populateFilters();
      render();
      showPanel(); // a linked #film=<id>
    })
    .catch(() => {
      summary.textContent = "Couldn't load showings. Try again later.";
    });
})();
</script>
</body>
</html>
