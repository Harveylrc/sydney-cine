<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sydney Cinema Guide</title>
<meta name="description" content="Every showing at Sydney cinemas on one page, filterable by film, director, type and date.">
<link rel="canonical" href="https://sydneycinema.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta property="og:title" content="Sydney Cinema Guide">
<meta property="og:description" content="Every showing at Sydney cinemas on one page, filterable by film, director, type and date.">
<meta property="og:url" content="https://sydneycinema.com/">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #181D3B;        /* page background */
    --inset: #131934;     /* inset fields */
    --divider: #0E1227;   /* rules between entries */
    --heading: #F2EAF1;   /* headings and key figures */
    --label: #CAD0E5;     /* labels and body text */
    --border: #4D5884;    /* field and button borders */
    --accent: #E8B86D;    /* links and the active filter */
    --muted: #9AA3C7;     /* secondary figures (session counts) */

    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --gutter: 32px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* beats display rules such as .detail's flex */

  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
  }

  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px var(--gutter) 48px;
  }

  /* Masthead */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    color: var(--heading);
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* Views (B21): header nav, the active one underlined. */
  .views { display: flex; gap: 20px; }
  .views button {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 4px 0;
    cursor: pointer;
  }
  .views button:hover { color: var(--heading); }
  .views button[aria-pressed="true"] { color: var(--heading); border-bottom-color: var(--accent); }

  /* Filters */
  .filters button, .filter-bar button {
    font: inherit;
    font-size: 0.9rem;
    color: var(--label);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
  }
  /* Filters toggle (B16): collapsed, the row shows what's set as removable chips. */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .filter-bar.open { padding-bottom: 0; border-bottom: 0; }
  .filter-toggle::after { content: " ▸"; }
  .filter-toggle[aria-expanded="true"]::after { content: " ▾"; }
  .filter-bar .filter-toggle { color: var(--heading); }
  .active-chips { display: contents; }
  .filter-bar .active-chips button {
    padding: 3px 10px;
    font-size: 0.85rem;
    color: var(--accent);
    border-color: var(--accent);
  }

  .filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 12px;
    padding: 14px 0 18px;
    border-bottom: 1px solid var(--border);
  }
  .filters label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .filters input, .filters select {
    font: inherit;
    font-size: 0.95rem;
    text-transform: none;
    letter-spacing: normal;
    color: var(--heading);
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    width: 100%;
    min-width: 0;
  }
  .filters .active { border-color: var(--accent); }
  /* Type-ahead suggestions (Director, Cinema), under the field. */
  .combo { position: relative; }
  .suggestions {
    position: absolute;
    z-index: 2;
    top: calc(100% + 2px);
    right: 0; /* grows leftwards: Director is never the first column */
    min-width: 100%;
    width: max-content;
    max-width: min(320px, calc(100vw - 2 * var(--gutter)));
    margin: 0;
    padding: 4px 0;
    list-style: none;
    font-size: 0.95rem;
    text-transform: none;
    letter-spacing: normal;
    color: var(--heading);
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .suggestions.from-left { left: 0; right: auto; } /* Cinema can be the first column */
  .suggestions li { padding: 5px 10px; cursor: pointer; }
  .suggestions li[aria-selected="true"], .suggestions li:hover { background: var(--bg); color: var(--accent); }
  .years { display: flex; gap: 6px; align-items: center; }
  .filters .reset { align-self: end; justify-self: start; }
  /* Region chips (B12): none pressed means every region. */
  .regions {
    grid-column: 1 / -1;
    margin: 0;
    padding: 0;
    border: 0;
    min-width: 0;
  }
  .regions legend {
    padding: 0;
    margin-bottom: 4px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  /* Regions ⓘ (B20): which LGAs make up each region, and a link to the map. */
  .regions { position: relative; }
  .filters .info {
    padding: 0 4px;
    margin-left: 2px;
    border: 0;
    font-size: 0.95rem;
    line-height: 1;
    color: var(--accent);
    vertical-align: -1px;
  }
  .popover {
    position: absolute;
    z-index: 3;
    top: 20px;
    left: 0;
    width: min(380px, calc(100vw - 2 * var(--gutter)));
    max-height: 70vh;
    overflow-y: auto;
    padding: 10px 14px 12px;
    font-size: 0.85rem;
    color: var(--label);
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
  .popover dl { margin: 0; }
  .popover dt { margin-top: 8px; color: var(--heading); font-weight: 700; }
  .popover dt:first-child { margin-top: 0; }
  .popover dd { margin: 1px 0 0; }
  .popover p { margin: 12px 0 0; }
  .filters .chips button { padding: 3px 12px; font-size: 0.85rem; }
  .filters .chips button[aria-pressed="true"] {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Listings */
  .day { margin-top: 28px; }
  .day h2 {
    margin: 0;
    padding-bottom: 6px;
    color: var(--heading);
    font-size: 1.35rem;
    font-weight: 800;
    border-bottom: 1px solid var(--border);
  }
  .film { border-bottom: 1px solid var(--divider); }
  /* Poster at left; beside it title (count at the far right), then year · director ·
     rating, then the type tag (B14). Same on phone and desktop. The whole row toggles
     its session box, which opens full width beneath it. */
  .film-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin: 0 -8px;
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .film-head:hover { background: rgba(255, 255, 255, 0.04); }
  .thumb {
    flex: none;
    display: block;
    width: 64px;
    height: 96px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--inset); /* also the placeholder when a film has no poster */
  }
  .film-head .text { flex: 1; min-width: 0; }
  .title-line { display: flex; align-items: baseline; gap: 0 16px; }
  .film h3 {
    margin: 0;
    color: var(--heading);
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.25;
  }
  /* Collapsed, a row is one poster tall: title and meta stop at two lines each.
     Opening shows them in full. */
  .film-head:not(.open) h3 button, .film-head:not(.open) .meta {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
  }
  .film h3 button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    cursor: pointer;
  }
  .film-head:hover h3 button { text-decoration: underline; }
  .count {
    margin-left: auto;
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .count::after { content: " ▸"; }
  .film-head.open .count::after { content: " ▾"; }
  .meta { margin: 1px 0 0; font-size: 0.85rem; line-height: 1.3; }
  .meta .rating { color: var(--heading); font-weight: 600; }
  .kind {
    margin: 2px 0 0;
    line-height: 1.3;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  @media (max-width: 480px) {
    .count .where { display: none; } /* room for the title; the box names the cinemas */
  }

  /* Detail: a box of day tabs over that day's sessions, full width under the row.
     It keeps one height across tabs and scrolls inside. */
  .detail { padding: 2px 0 14px; }
  .box {
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .tabs {
    display: flex;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    scrollbar-width: thin;
  }
  .tabs button {
    flex: none;
    padding: 6px 10px;
    font: inherit;
    font-size: 0.8rem;
    color: var(--label);
    white-space: nowrap;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    color: var(--accent);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }
  /* Days most cinemas haven't published yet (B10d). */
  .partial-note { margin: 6px 0 0; font-size: 0.85rem; color: var(--muted); }
  .tabs .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 4px;
    vertical-align: middle;
    border-radius: 50%;
    background: var(--muted);
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .day-sessions { padding: 8px 10px; } /* natural height, no inner scroll (B21) */
  /* One row per session: time · cinema · tags */
  .sessions {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.9rem;
  }
  .sessions li + li { margin-top: 2px; }
  .sessions .time {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
  }
  .sessions a.time:hover { text-decoration: underline; }
  .sessions .late, .sessions .tags { font-size: 0.75rem; }

  @media (max-width: 480px) {
    :root { --gutter: 16px; }
  }

  .empty { margin-top: 28px; }

  footer {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
  }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Sydney Cinema Guide</h1>
    <nav class="views" aria-label="Views">
      <button type="button" data-view="week" aria-pressed="true">What's on this week</button>
      <button type="button" data-view="all" aria-pressed="false">All showings</button>
    </nav>
  </header>

  <div class="filter-bar" id="filter-bar">
    <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters">Filters<span id="filter-count"></span></button>
    <div class="active-chips" id="active-chips"></div>
  </div>

  <form class="filters" id="filters" autocomplete="off" hidden>
    <label>Film
      <input type="search" name="film" placeholder="Any film">
    </label>
    <label>Director
      <span class="combo">
        <input type="search" name="director" placeholder="Any director" role="combobox"
          aria-autocomplete="list" aria-expanded="false" aria-controls="director-list">
        <ul id="director-list" class="suggestions" role="listbox" aria-label="Directors" hidden></ul>
      </span>
    </label>
    <label>Cinema
      <span class="combo">
        <input type="search" name="cinema" placeholder="Any cinema" role="combobox"
          aria-autocomplete="list" aria-expanded="false" aria-controls="cinema-list">
        <ul id="cinema-list" class="suggestions from-left" role="listbox" aria-label="Cinemas" hidden></ul>
      </span>
    </label>
    <label>Type
      <select name="type">
        <option value="">Any type</option>
        <option value="new_release">New release</option>
        <option value="retrospective">Retrospective</option>
        <option value="festival">Festival</option>
        <option value="special">Special</option>
      </select>
    </label>
    <label>Date
      <select name="day"><option value="">Any date</option></select>
    </label>
    <label>Released
      <span class="years">
        <input type="number" name="from" inputmode="numeric" placeholder="From" min="1890" max="2100">
        <input type="number" name="to" inputmode="numeric" placeholder="To" min="1890" max="2100">
      </span>
    </label>
    <label>Sort
      <select name="sort" data-default="popular">
        <option value="popular">Popular</option>
        <option value="az">A–Z</option>
      </select>
    </label>
    <fieldset class="regions" hidden>
      <legend>Region<button type="button" class="info" id="region-info-button" aria-expanded="false"
        aria-controls="region-info" aria-label="Which areas are in each region" title="Which areas are in each region" hidden>ⓘ</button></legend>
      <div class="popover" id="region-info" role="dialog" aria-label="Regions" hidden></div>
      <div class="chips" id="region-chips"></div>
    </fieldset>
    <button type="reset" class="reset">Clear filters</button>
  </form>

  <main id="listings"><p class="empty">Loading showings…</p></main>

  <footer>
    <p id="updated"></p>
    <p>Film details from <a href="https://www.themoviedb.org/">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p>Times link to each cinema's own booking page. Check there before you go.</p>
  </footer>
</div>

<script>
(() => {
  const TYPE_LABELS = {
    new_release: "New release",
    retrospective: "Retrospective",
    festival: "Festival",
    special: "Special",
  };
  // Rows tag only these; new releases are the default and stay unlabelled.
  const ROW_TAGS = { retrospective: "Retro", festival: "Festival", special: "Special" };
  const typesOf = (showings) => Object.keys(TYPE_LABELS).filter((t) => showings.some((s) => s.type === t));

  const $ = (sel) => document.querySelector(sel);
  const form = $("#filters");
  const listings = $("#listings");
  let data = null;
  let filmsById = new Map();
  let entryCount = 0;
  let thisYear = new Date().getFullYear();
  let unfiltered = new Map(); // week start -> film id -> all that week's showings, for ranking
  let byFilm = new Map(); // film id -> all its showings in start order, for a row's detail
  let view = "week"; // "week": this week only; "all": every week (B21)

  // Element helper: text is always set as text, never parsed as HTML.
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) if (child) node.append(child);
    return node;
  }

  const fold = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const dayShort = (iso) =>
    new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", {
      weekday: "short", day: "numeric", month: "short", timeZone: "UTC",
    });

  const safeUrl = (url) => (url && /^https?:\/\//.test(url) ? url : null);

  function currentFilters() {
    const f = new FormData(form);
    const year = (v) => (v ? Number(v) : null);
    return {
      film: fold(f.get("film").trim()),
      director: fold(f.get("director").trim()),
      cinema: fold(f.get("cinema").trim()),
      type: f.get("type"),
      day: f.get("day"),
      from: year(f.get("from")),
      to: year(f.get("to")),
      sort: f.get("sort"),
      regions: selectedRegions,
    };
  }

  // rank:start — Popular score (DECISIONS 2026-10-18 "Ranking formula"); tests/test_rank.py runs this block in node.
  // Quality × familiarity, plus an age bonus, a capped share for session count and a
  // small bump for independent cinemas. A recent film shown as a retrospective (a
  // re-release) gets no age bonus and its votes are capped lower.
  const CHAINS = ["hoyts-", "event-", "reading-"];
  function rankScore(film, showings, thisYear) {
    const rerelease = film.year != null && thisYear - film.year < 10 && showings.some((s) => s.type === "retrospective");
    const age = film.year != null && !rerelease ? Math.max(thisYear - film.year, 0) : 0;
    const votes = Math.min(film.vote_count || 0, rerelease ? 5000 : 30000);
    const quality = Math.max((film.rating || 0) - 5, 0);
    const independent = showings.filter((s) => !CHAINS.some((c) => s.venue.startsWith(c))).length;
    return quality * Math.log(votes + 1) + 1.5 * Math.log(age + 1)
      + 0.15 * Math.min(showings.length, 80) + 0.3 * Math.min(independent, 5);
  }
  // rank:end
  const byTitle = (a, b) => a.film.title.localeCompare(b.film.title, "en", { sensitivity: "base" });
  const ORDERS = {
    popular: (a, b) => b.score - a.score || byTitle(a, b),
    az: byTitle,
  };

  // Ranks on all of a film's sessions that week, whatever the filters (Harvey, B9b, B21).
  function orderFilms(week, films, sort) {
    return [...films]
      .map(([id, showings]) => {
        const film = filmsById.get(id);
        return { film, showings, score: rankScore(film, unfiltered.get(week.start).get(id), thisYear) };
      })
      .sort(ORDERS[sort] || ORDERS.popular);
  }

  // A cinema's full name picks that cinema only; part of a name, any it is part of.
  function cinemaMatches(venue, q) {
    const key = fold(venueName(venue));
    return cinemaNames && cinemaNames.some((c) => c.key === q) ? key === q : key.includes(q);
  }

  function matches(s, film, f) {
    if (f.film && !fold(film.title).includes(f.film) && !fold(s.title).includes(f.film)) return false;
    if (f.director && !fold(film.director).includes(f.director)) return false;
    if (f.cinema && !cinemaMatches(s.venue, f.cinema)) return false;
    if (f.type && s.type !== f.type) return false;
    if (f.regions.size && !s.regions.some((r) => f.regions.has(r))) return false;
    if (f.day && s.day !== f.day) return false;
    if ((f.from || f.to) && film.year == null) return false;
    if (f.from && film.year < f.from) return false;
    if (f.to && film.year > f.to) return false;
    return true;
  }

  // Region chips: built from data.json's regions; several can be on at once.
  const selectedRegions = new Set();
  // Regions ⓘ: each region's LGAs, from data.json's region_lgas (venues.yaml).
  const regionInfo = $("#region-info");
  const regionInfoButton = $("#region-info-button");
  function populateRegionInfo() {
    const table = data.region_lgas || {};
    const list = el("dl");
    for (const [region, lgas] of Object.entries(table)) {
      list.append(el("dt", { text: region }), el("dd", { text: lgas.join(", ") }));
    }
    const map = el("a", { href: "regions-map.svg", target: "_blank", rel: "noopener", text: "See on a map" });
    regionInfo.replaceChildren(list, el("p", {}, map));
    regionInfoButton.hidden = !Object.keys(table).length;
  }
  function setRegionInfo(open) {
    regionInfo.hidden = !open;
    regionInfoButton.setAttribute("aria-expanded", String(open));
  }
  regionInfoButton.addEventListener("click", () => setRegionInfo(regionInfo.hidden));
  document.addEventListener("click", (e) => {
    if (!regionInfo.hidden && !regionInfo.contains(e.target) && e.target !== regionInfoButton) setRegionInfo(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || regionInfo.hidden) return;
    setRegionInfo(false);
    regionInfoButton.focus();
  });

  function populateRegions() {
    const chips = $("#region-chips");
    for (const region of data.regions || []) {
      const chip = el("button", { type: "button", "aria-pressed": "false", text: region });
      chip.addEventListener("click", () => {
        if (selectedRegions.has(region)) selectedRegions.delete(region);
        else selectedRegions.add(region);
        chip.setAttribute("aria-pressed", String(selectedRegions.has(region)));
        render();
      });
      chips.append(chip);
    }
    $(".regions").hidden = !chips.childNodes.length;
  }
  const syncChips = (container, selected) =>
    container.querySelectorAll("button").forEach((chip) =>
      chip.setAttribute("aria-pressed", String(selected.has(chip.textContent))));

  // Filters toggle (B16): the block starts collapsed; its open state is remembered
  // in this browser. Collapsed, each active filter shows as a chip that clears it.
  const filterBar = $("#filter-bar");
  const filterToggle = $("#filter-toggle");
  const activeChips = $("#active-chips");
  const FILTERS_OPEN = "sydney-cine.filtersOpen";
  function setFiltersOpen(open) {
    form.hidden = !open;
    activeChips.hidden = open;
    filterToggle.setAttribute("aria-expanded", String(open));
    filterBar.classList.toggle("open", open);
    try { localStorage.setItem(FILTERS_OPEN, open ? "1" : "0"); } catch { /* private mode */ }
  }
  try { setFiltersOpen(localStorage.getItem(FILTERS_OPEN) === "1"); } catch { setFiltersOpen(false); }
  filterToggle.addEventListener("click", () => setFiltersOpen(form.hidden));

  // [label, clear()] for each filter that is set; Sort is an order, not a filter.
  function activeFilters() {
    const fields = form.elements;
    const clearField = (name) => () => { fields[name].value = ""; };
    const list = [];
    if (fields.film.value.trim()) list.push([`“${fields.film.value.trim()}”`, clearField("film")]);
    if (fields.director.value.trim()) list.push([fields.director.value.trim(), clearField("director")]);
    if (fields.cinema.value.trim()) list.push([fields.cinema.value.trim(), clearField("cinema")]);
    if (fields.type.value) list.push([TYPE_LABELS[fields.type.value], clearField("type")]);
    if (fields.day.value) list.push([dayShort(fields.day.value), clearField("day")]);
    const from = fields.from.value, to = fields.to.value;
    if (from || to) {
      const label = from && to ? `Released ${from}–${to}` : from ? `Released from ${from}` : `Released to ${to}`;
      list.push([label, () => { fields.from.value = ""; fields.to.value = ""; }]);
    }
    for (const region of selectedRegions) {
      list.push([region, () => { selectedRegions.delete(region); syncChips($("#region-chips"), selectedRegions); }]);
    }
    return list;
  }

  function updateFilterBar() {
    const list = activeFilters();
    $("#filter-count").textContent = list.length ? ` · ${list.length}` : "";
    activeChips.replaceChildren(...list.map(([label, clear]) => {
      const chip = el("button", { type: "button", "aria-label": `Remove filter: ${label}`, text: `${label} ×` });
      chip.addEventListener("click", () => {
        clear();
        render();
        filterToggle.focus(); // the chip is gone; keep keyboard focus in the row
      });
      return chip;
    }));
  }

  function markActive() {
    for (const field of form.querySelectorAll("input, select")) {
      field.classList.toggle("active", field.value !== (field.dataset.default || ""));
    }
  }

  // Poster, then beside it: title and count; year · director · rating (· runtime when
  // open); the type tag on its own line. Tapping the row opens its session box in
  // place beneath it (B10c, B14); several can be open; tapping again closes.
  const openers = new WeakMap(); // entry -> open(), for #film= links
  // One row per film per week (B21): showings are that week's, in start order.
  function filmEntry(film, showings, week) {
    const day = showings[0].day; // the box opens on the film's first day that week
    const extra = details[film.id] || {};
    const meta = el("p", { class: "meta" });
    const parts = [film.year, film.director].filter(Boolean).map(String);
    parts.forEach((p, i) => meta.append((i ? " · " : "") + p));
    if (film.rating != null) {
      meta.append(parts.length ? " · " : "", el("span", { class: "rating", text: film.rating.toFixed(1) }), " TMDB");
    }
    const runtime = extra.runtime
      ? el("span", { class: "runtime", text: `${meta.childNodes.length ? " · " : ""}${extra.runtime} min`, hidden: "" })
      : null;
    if (runtime) meta.append(runtime);
    const tags = typesOf(showings).filter((t) => ROW_TAGS[t]).map((t) => ROW_TAGS[t]);

    const detailId = `detail-${++entryCount}`;
    const toggle = el("button", { type: "button", "aria-expanded": "false", "aria-controls": detailId, title: film.title, text: film.title });
    const text = el("div", { class: "text" }, el("div", { class: "title-line" }, el("h3", {}, toggle), countLabel(showings)));
    if (meta.childNodes.length) text.append(meta);
    if (tags.length) text.append(el("p", { class: "kind", text: tags.join(" · ") }));
    const poster = extra.poster_path
      ? el("img", { class: "thumb", src: POSTER + extra.poster_path, alt: "", width: "64", height: "96", loading: "lazy" })
      : el("div", { class: "thumb", "aria-hidden": "true" });
    const head = el("div", { class: "film-head" }, poster, text);
    const entry = el("article", { class: "film", "data-film": film.id }, head);

    let detail = null; // built on first open
    function setOpen(open) {
      if (open && !detail) {
        entry.append((detail = filmDetail(film, week, day, detailId)));
        detail.select();
      }
      if (detail) detail.hidden = !open;
      if (runtime) runtime.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
      head.classList.toggle("open", open);
      // The address names the last film opened, so it can be shared; no history entry.
      if (open) history.replaceState(null, "", "#film=" + encodeURIComponent(film.id));
      else if (hashFilm() === film.id) history.replaceState(null, "", location.pathname + location.search);
    }
    openers.set(entry, () => setOpen(true));
    // The whole header row toggles (title, meta, count and the space between); the
    // title stays the button for keyboards and screen readers.
    head.addEventListener("click", () => {
      const selection = window.getSelection();
      if (!selection.isCollapsed && head.contains(selection.anchorNode)) return; // selecting text
      setOpen(toggle.getAttribute("aria-expanded") !== "true");
    });
    entry.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || toggle.getAttribute("aria-expanded") !== "true") return;
      setOpen(false);
      toggle.focus();
    });
    return entry;
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const venueName = (slug) => (data.venues[slug] && data.venues[slug].name) || slug;

  // "14 sessions · 9 cinemas"; one cinema is named: "1 session · Ritz Randwick".
  // Phones show the sessions part only.
  function countLabel(showings) {
    const venues = new Set(showings.map((s) => s.venue));
    const where = venues.size === 1 ? venueName([...venues][0]) : plural(venues.size, "cinema");
    return el("span", { class: "count" }, plural(showings.length, "session"),
      el("span", { class: "where", text: ` · ${where}` }));
  }

  function sessionRows(film, showings) {
    const rows = el("ul", { class: "sessions" });
    for (const s of showings) {
      const url = safeUrl(s.booking_url);
      const time = url
        ? el("a", { class: "time", href: url, rel: "noopener", target: "_blank", text: s.time })
        : el("span", { class: "time", text: s.time });
      const row = el("li", {}, time);
      if (s.late) row.append(" ", el("span", { class: "late", text: "(late)" }));
      row.append(" · " + venueName(s.venue));
      if (s.attributes.length) row.append(" · ", el("span", { class: "tags", text: s.attributes.join(", ") }));
      if (s.title !== film.title) row.title = s.title;
      rows.append(row);
    }
    return rows;
  }

  // poster_path and runtime live in films.json, loaded alongside data.json (B14).
  const POSTER = "https://image.tmdb.org/t/p/w92";
  let details = {};

  const PARTIAL_NOTE = "Most cinemas publish the following week's sessions on Wednesday.";
  // Not for retrospectives, festivals or special events (the Type filter on one of
  // those): they're programmed well ahead, not on the chains' Wednesday cycle.
  const PLANNED_AHEAD = new Set(["retrospective", "festival", "special"]);
  const plannedAheadOnly = () => PLANNED_AHEAD.has(form.elements.type.value);
  const isPartial = (day) =>
    !plannedAheadOnly() && Boolean(data.days && data.days[day] && data.days[day].partial);
  // A week gets the note when most of its days are partial (or have no sessions yet).
  const isPartialWeek = (week) => {
    const days = weekDays(week);
    return !plannedAheadOnly()
      && days.filter((d) => !data.days || !data.days[d] || data.days[d].partial).length > days.length / 2;
  };

  // Weeks (DECISIONS 2026-10-29): the first runs from the export day to the coming
  // Sunday (just that day if it is a Sunday), then Monday–Sunday, the last cut at
  // the horizon. Dates are ISO strings read as UTC so no time zone shifts them.
  const HORIZON_DAYS = 14; // as export.py
  const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
  let firstDay = null;
  let lastDay = null;
  function weekOf(iso) {
    const monday = addDays(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
    const sunday = addDays(monday, 6);
    return { start: monday < firstDay ? firstDay : monday, end: sunday > lastDay ? lastDay : sunday };
  }
  function weekDays(week) {
    const days = [];
    for (let d = week.start; d <= week.end; d = addDays(d, 1)) days.push(d);
    return days;
  }
  const shortDate = (iso) =>
    new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: "UTC" });
  const weekHeading = (week) =>
    week.start === week.end ? shortDate(week.start) : `${shortDate(week.start)} - ${shortDate(week.end)}`;
  const partialNote = () => el("p", { class: "partial-note", text: PARTIAL_NOTE });

  const tabLabel = (iso) =>
    new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", { weekday: "short", day: "numeric", timeZone: "UTC" });

  // A box: a tab per day of the row's week with sessions, over that day's
  // `time · cinema · tags` rows, at its natural height. Starts on the row's first day.
  function filmDetail(film, week, day, id) {
    const byDay = new Map();
    const cinema = currentFilters().cinema; // with a cinema chosen, only its sessions (B19b)
    for (const s of byFilm.get(film.id) || []) {
      if (s.day < week.start || s.day > week.end) continue;
      if (cinema && !cinemaMatches(s.venue, cinema)) continue;
      if (!byDay.has(s.day)) byDay.set(s.day, []);
      byDay.get(s.day).push(s);
    }
    const days = [...byDay.keys()];

    const tabs = el("div", { class: "tabs", role: "tablist", "aria-label": `Sessions of ${film.title} by day` });
    const lists = el("div", { class: "day-sessions" });
    const buttons = days.map((d, i) => {
      const list = el("div", { role: "tabpanel", id: `${id}-day-${i}`, "aria-labelledby": `${id}-tab-${i}` });
      // A retrospective, festival or special screening is programmed ahead, so a
      // day where all of this film's sessions are one of those gets no dot.
      const noted = isPartial(d) && !byDay.get(d).every((s) => PLANNED_AHEAD.has(s.type));
      list.append(sessionRows(film, byDay.get(d)));
      lists.append(list);
      const button = el("button", { type: "button", role: "tab", id: `${id}-tab-${i}`, "aria-controls": `${id}-day-${i}`, text: tabLabel(d) });
      if (noted) {
        button.append(el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "sr-only", text: " (not fully published)" }));
        button.title = "Not fully published yet";
      }
      button.addEventListener("click", () => select(i));
      tabs.append(button);
      return button;
    });
    function select(i, focus = false) {
      buttons.forEach((b, j) => {
        b.setAttribute("aria-selected", String(i === j));
        b.tabIndex = i === j ? 0 : -1;
        lists.children[j].hidden = i !== j;
      });
      tabs.scrollLeft = buttons[i].offsetLeft - tabs.offsetLeft - 24;
      if (focus) buttons[i].focus();
    }
    tabs.addEventListener("keydown", (e) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      const now = buttons.findIndex((b) => b.getAttribute("aria-selected") === "true");
      select((now + step + buttons.length) % buttons.length, true);
    });

    const detail = el("div", { class: "detail", id }, el("div", { class: "box" }, tabs, lists));
    detail.select = () => select(Math.max(days.indexOf(day), 0));
    return detail;
  }

  const hashFilm = () => {
    const m = location.hash.match(/^#film=(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  };

  // #film=<id>: open that film's first row and bring it into view; a film not on
  // this week opens in All showings, in the first week it appears.
  function openFromHash() {
    const id = hashFilm();
    const find = () => id && listings.querySelector(`.film[data-film="${CSS.escape(id)}"]`);
    let entry = find();
    if (!entry && id && view === "week") {
      setView("all");
      entry = find();
    }
    if (!entry) return;
    openers.get(entry)();
    entry.scrollIntoView({ block: "start" });
  }
  window.addEventListener("hashchange", () => data && openFromHash());

  function render() {
    markActive();
    updateFilterBar();
    const f = currentFilters();
    const weeks = new Map(); // week start -> { week, films: film id -> showings, in start order }
    let count = 0;
    for (const s of data.showings) {
      const film = filmsById.get(s.film);
      if (!film || !matches(s, film, f)) continue;
      const week = weekOf(s.day);
      if (view === "week" && week.start !== firstDay) continue; // this week only
      count++;
      if (!weeks.has(week.start)) weeks.set(week.start, { week, films: new Map() });
      const films = weeks.get(week.start).films;
      if (!films.has(s.film)) films.set(s.film, []);
      films.get(s.film).push(s);
    }

    listings.replaceChildren();
    for (const [, { week, films }] of [...weeks].sort(([a], [b]) => a.localeCompare(b))) {
      const section = el("section", { class: "day" }, el("h2", { text: weekHeading(week) }));
      if (isPartialWeek(week)) section.append(partialNote());
      for (const { film, showings } of orderFilms(week, films, f.sort)) section.append(filmEntry(film, showings, week));
      listings.append(section);
    }

    if (!count) {
      const director = form.elements.director.value.trim();
      const msg = directorNames && directorNames.some((d) => d.key === f.director)
          && !data.films.some((film) => fold(film.director).includes(f.director))
        ? `Nothing by ${director} in the next two weeks.` // a known director, not on now
        : view === "week" ? "No showings match these filters this week." : "No showings match these filters.";
      listings.append(el("p", { class: "empty", text: msg }));
    }
  }

  function populateFilters() {
    const daySelect = form.elements.day;
    for (const day of [...new Set(data.showings.map((s) => s.day))].sort()) {
      daySelect.append(el("option", { value: day, text: dayShort(day) }));
    }
    for (const film of data.films) {
      for (const name of (film.director || "").split(", ")) if (name) showingDirectors.add(name);
    }
  }

  // Type-ahead (Director B11, Cinema B19b): suggestions under the field as you type.
  // Matches ignore case and accents; a match at the start of a word comes first,
  // then `order`. ↑ ↓ move, Enter picks, Esc closes the list and keeps the text.
  const MAX_SUGGESTIONS = 8;
  function typeAhead(input, list, idPrefix, getNames, order, load) {
    let shown = [];
    let active = -1;
    function suggest() {
      const q = fold(input.value.trim());
      const names = getNames();
      shown = !q || !names ? [] : names
        .map((d) => ({ ...d, at: d.key.indexOf(q) }))
        .filter((d) => d.at >= 0 && d.key !== q)
        .map((d) => ({ ...d, wordStart: d.at === 0 || d.key[d.at - 1] === " " }))
        .sort((a, b) => b.wordStart - a.wordStart || order(a, b))
        .slice(0, MAX_SUGGESTIONS);
      active = -1;
      list.replaceChildren(...shown.map((d, i) =>
        el("li", { role: "option", id: `${idPrefix}-${i}`, "aria-selected": "false", text: d.name })));
      const open = shown.length > 0 && document.activeElement === input;
      list.hidden = !open;
      input.setAttribute("aria-expanded", String(open));
      input.removeAttribute("aria-activedescendant");
    }
    function highlight(i) {
      active = i;
      list.querySelectorAll("li").forEach((li, j) => li.setAttribute("aria-selected", String(j === i)));
      if (i >= 0) input.setAttribute("aria-activedescendant", `${idPrefix}-${i}`);
      else input.removeAttribute("aria-activedescendant");
    }
    function close() {
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
    }
    function choose(name) {
      input.value = name;
      suggest(); // an exact name has no suggestions left, so the list closes
      render();
    }
    input.addEventListener("focus", () => (getNames() ? suggest() : load().then(suggest)));
    input.addEventListener("input", suggest);
    input.addEventListener("blur", close);
    input.addEventListener("keydown", (e) => {
      if (list.hidden) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        // Down from the last, or up from the first, goes back to the typed text (-1).
        const next = active + (e.key === "ArrowDown" ? 1 : -1);
        highlight(next >= shown.length ? -1 : next < -1 ? shown.length - 1 : next);
      } else if (e.key === "Enter" && active >= 0) {
        e.preventDefault();
        choose(shown[active].name);
      } else if (e.key === "Escape") {
        e.preventDefault(); // close the list, keep the text
        close();
      }
    });
    list.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the field
    list.addEventListener("click", (e) => {
      const li = e.target.closest("li");
      if (li) choose(li.textContent);
    });
  }

  // Directors: directors.json (~2,000 well-known directors, rebuilt monthly) plus
  // everyone in data.json, loaded on first focus; after word starts, directors
  // with sessions now, then the list's order (best known first).
  const showingDirectors = new Set();
  let directorNames = null;
  let directorsLoading = null;
  function loadDirectors() {
    directorsLoading = directorsLoading || fetch("directors.json", { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : []))
      .catch(() => [])
      .then((names) => {
        const all = [...new Set([...names, ...[...showingDirectors].sort()])];
        directorNames = all.map((name, rank) => ({ name, key: fold(name), rank, now: showingDirectors.has(name) }));
      });
    return directorsLoading;
  }
  typeAhead(form.elements.director, $("#director-list"), "director", () => directorNames,
    (a, b) => b.now - a.now || a.rank - b.rank, loadDirectors);

  // Cinemas: every cinema with sessions, by its venues.yaml display name, A–Z.
  let cinemaNames = null;
  typeAhead(form.elements.cinema, $("#cinema-list"), "cinema", () => cinemaNames,
    (a, b) => a.rank - b.rank, () => Promise.resolve());

  function setView(next) {
    view = next;
    document.querySelectorAll(".views button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    render();
  }
  document.querySelectorAll(".views button").forEach((button) => {
    button.addEventListener("click", () => setView(button.dataset.view));
  });
  form.addEventListener("input", () => data && render());
  form.addEventListener("reset", () => {
    selectedRegions.clear();
    syncChips($("#region-chips"), selectedRegions);
    setTimeout(() => data && render());
  });
  form.addEventListener("submit", (e) => e.preventDefault());

  // films.json is optional: without it, rows show the poster placeholder.
  const filmDetails = fetch("films.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : {}))
    .catch(() => ({}));
  fetch("data.json", { cache: "no-cache" })
    .then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then((json) => filmDetails.then((extra) => [json, extra]))
    .then(([json, extra]) => {
      data = json;
      details = extra || {};
      filmsById = new Map(data.films.map((f) => [f.id, f]));
      thisYear = Number(data.generated_at.slice(0, 4)) || thisYear;
      firstDay = data.today || data.showings.map((s) => s.day).sort()[0];
      lastDay = addDays(firstDay, HORIZON_DAYS - 1);
      for (const s of data.showings) {
        const start = weekOf(s.day).start;
        if (!unfiltered.has(start)) unfiltered.set(start, new Map());
        const films = unfiltered.get(start);
        if (!films.has(s.film)) films.set(s.film, []);
        films.get(s.film).push(s);
        if (!byFilm.has(s.film)) byFilm.set(s.film, []);
        byFilm.get(s.film).push(s);
      }
      for (const showings of byFilm.values()) showings.sort((a, b) => a.start.localeCompare(b.start));
      const updated = new Date(data.generated_at).toLocaleString("en-AU", {
        timeZone: "Australia/Sydney", weekday: "short", day: "numeric", month: "short",
        hour: "numeric", minute: "2-digit",
      });
      $("#updated").textContent = `Updated ${updated}. Cinemas: ${
        Object.values(data.venues).map((v) => v.name).join(", ")}.`;
      cinemaNames = [...new Set(data.showings.map((s) => venueName(s.venue)))]
        .sort((a, b) => a.localeCompare(b, "en", { sensitivity: "base" }))
        .map((name, rank) => ({ name, key: fold(name), rank }));
      populateFilters();
      populateRegions();
      populateRegionInfo();
      render();
      openFromHash(); // a linked #film=<id>
    })
    .catch(() => {
      listings.replaceChildren(el("p", { class: "empty", text: "Couldn't load showings. Try again later." }));
    });
})();
</script>
</body>
</html>
